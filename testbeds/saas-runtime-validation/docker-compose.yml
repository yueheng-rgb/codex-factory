version: "3.8"
services:
  app:
    build: .
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=staging
      - PORT=3100
      - DB_MODE=inmemory
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://localhost:3100/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 3s
      retries: 3

