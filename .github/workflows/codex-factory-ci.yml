# Codex Factory V3.4 — GitHub Actions CI Workflow
# Status: REMOTE_EXECUTED — fix applied for Linux runner

name: Codex Factory CI

on:
  workflow_dispatch:
    inputs:
      testbed:
        description: "Testbed to run"
        required: false
        default: "products-api"
        type: choice
        options:
          - products-api
          - cross-pack-cpm-001
          - admin-system-runtime-validation
          - ecommerce-runtime-validation
          - saas-runtime-validation
          - miniapp-runtime-validation
          - game-threejs-runtime-validation
          - cpp-memory-safety-runtime-validation

jobs:
  snapshot-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Snapshot Verifier
        shell: pwsh
        run: pwsh -File runtime/snapshot-verifier.ps1
      - name: Upload verifier logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-verify-logs
          path: |
            runtime/snapshot-verifier.ps1
            outputs/
          retention-days: 7

  regression:
    needs: snapshot-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Dependencies
        run: cd testbeds/${{ inputs.testbed }} && npm ci
      - name: Run Tests
        run: cd testbeds/${{ inputs.testbed }} && npm test
      - name: Secret Scan
        shell: pwsh
        run: |
          $found = Select-String -Path "outputs/**/*.json","outputs/**/*.md" -Pattern "(sk-[a-zA-Z0-9]{20,})|(AIza[0-9A-Za-z\-_]{35})|(ghp_[a-zA-Z0-9]{36})|(AKIA[0-9A-Z]{16})" -ErrorAction SilentlyContinue
          if ($found) { Write-Output "SECRETS_FOUND"; exit 1 } else { Write-Output "NO_SECRETS_FOUND" }
      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-artifacts-${{ inputs.testbed }}
          path: |
            artifacts/
            outputs/V2_9/V2_9_IMMUTABLE_SNAPSHOT_MANIFEST.json
          retention-days: 7

  frozen-trunk-check:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify frozen trunk not modified
        shell: pwsh
        run: |
          $frozen = @("runtime/execution-runner.ps1","runtime/snapshot-verifier.ps1","governance/AGENTS.md","schemas/execution-run.schema.json")
          Write-Output "Frozen trunk files listed — manual audit required for modifications"
          Write-Output "Template is READ-ONLY; modifications require explicit approval"
      - name: Upload frozen trunk check logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-trunk-check-logs
          path: |
            runtime/
            governance/AGENTS.md
            schemas/
          retention-days: 7
